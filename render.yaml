# Render Blueprint — https://render.com/docs/blueprint-spec
# Connect this repo in Render and fill in the secret env vars below.
services:
  - type: web
    name: lost-n-found
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_ALLOWED_DOMAIN
        value: mys.rvu.edu.in
      - key: APP_ORIGIN
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: RDS_DATABASE_URL
        sync: false
      - key: RDS_PASSWORD
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: us-east-1
