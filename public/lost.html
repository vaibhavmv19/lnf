<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lost items · Lost N Found</title>
  <meta name="description" content="Belongings people are hoping to find again. Browse lost item reports and see if you can help." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body data-page="explore" data-nav="lost" data-lock-type="lost">
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header" class="site-header"></header>

  <main id="main">
    <div class="wrap page-head">
      <h1>Lost items</h1>
      <p>Things people are hoping to find again. If you have seen one, a private message can make someone’s week.</p>
    </div>

    <div class="filters">
      <div class="wrap">
        <div class="filters-row">
          <div class="chip-row">
            <a class="chip" href="/explore">All items</a>
            <span class="chip is-active">Lost</span><a class="chip" href="/found">Found</a>
          </div>
          <div class="filters-spacer"></div>
          <label class="filters-search">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.3-3.3"/></svg>
            <input class="input" id="search-input" type="search" placeholder="Search lost items" aria-label="Search lost listings" />
          </label>
          <select class="select" id="sort-select" aria-label="Sort listings">
            <option value="recent">Recently added</option>
            <option value="relevant">Most relevant</option>
            <option value="oldest">Oldest first</option>
          </select>
          <button class="btn btn-outline btn-sm" id="more-filters" type="button" aria-expanded="false">Filters</button>
        </div>

        <div class="filter-panel hidden" id="filter-panel">
          <div class="field">
            <span class="label">Category</span>
            <select class="select" id="category-select"><option value="">All categories</option></select>
          </div>
          <div class="field">
            <span class="label">City</span>
            <input class="input" id="city-input" type="text" placeholder="e.g. Mysore" list="city-options" />
            <datalist id="city-options"></datalist>
          </div>
          <div class="field">
            <span class="label">From date</span>
            <input class="input" id="from-input" type="date" />
          </div>
          <div class="field">
            <span class="label">To date</span>
            <input class="input" id="to-input" type="date" />
          </div>
          <div class="row" style="grid-column: 1 / -1; justify-content: flex-end">
            <button class="btn btn-ghost btn-sm" id="clear-filters" type="button">Clear filters</button>
            <button class="btn btn-primary btn-sm" id="apply-filters" type="button">Apply filters</button>
          </div>
        </div>
      </div>
    </div>

    <section class="section-tight">
      <div class="wrap">
        <div class="spread" style="margin-bottom: 14px">
          <span class="result-count" id="result-count">Loading listings&hellip;</span>
        </div>
        <div class="masonry" id="results"></div>
        <div class="load-more-wrap" id="load-more-wrap"></div>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <script src="/js/core.js"></script>
  <script src="/js/explore.js"></script>
</body>
</html>
